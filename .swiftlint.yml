# SwiftLint configuration for Reclaim (PLAN.md §4: deletion only through DeletionEngine).

included:
  - Packages/ReclaimKit/Sources
  - Packages/ReclaimKit/Tests
  - Apps/Reclaim/Sources
  - Apps/Reclaim/Helper

excluded:
  - Packages/ReclaimKit/.build
  - build
  - docs

analyzer_rules: []

opt_in_rules:
  - array_init
  - closure_spacing
  - contains_over_filter_count
  - contains_over_first_not_nil
  - discouraged_optional_boolean
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicit_return
  - last_where
  - legacy_multiple
  - modifier_order
  - multiline_arguments
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_in_static_references
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - unused_optional_binding
  - yoda_condition

disabled_rules:
  - todo
  - trailing_comma
  - opening_brace          # SwiftFormat owns brace placement

line_length:
  warning: 140
  error: 180
  ignores_comments: true
  ignores_urls: true

identifier_name:
  min_length: 1
  excluded: [id, fd, st, io, up, to, of, rc, i, j, k, n, p, a, b]

type_body_length:
  warning: 400
  error: 600

function_body_length:
  warning: 80
  error: 120

file_length:
  warning: 600
  error: 900

cyclomatic_complexity:
  warning: 15
  error: 25

nesting:
  type_level: 3

force_unwrapping:
  severity: warning

custom_rules:
  no_direct_unlink:
    # PLAN.md §4 / T2-NO-DIRECT-UNLINK: nothing deletes outside DeletionEngine and the helper's Deleter.
    # Test support, the bench harness and tests are exempt (they clean up their own fixtures).
    name: "No direct deletion outside DeletionEngine"
    regex: '\b(unlinkat|unlink|rmdir|removeItem|trashItem|recycle)\s*\('
    excluded:
      - ".*/ReclaimSafety/Delete/DeletionEngine\\.swift"
      - ".*/Helper/ReclaimHelper/Deleter\\.swift"
      - ".*/ReclaimTestSupport/.*"
      - ".*/ReclaimBench/.*"
      - ".*/Tests/.*"
    match_kinds:
      - identifier
    message: "Deletion must go through DeletionEngine (PLAN.md §4). Add the file to the allowlist only with an ADR."
    severity: error
  no_shell_execution:
    # ADR-005 / REQ-ENUM-1: never build shell command strings.
    name: "No shell command execution"
    regex: '(/bin/(ba|z)?sh|"sh"\s*,\s*"-c"|Process\(\)\.launchPath\s*=\s*"/bin/)'
    message: "Run tools via ToolRunner with argument arrays; never spawn a shell (PLAN.md §2.10, EC-01)."
    severity: error
